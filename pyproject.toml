[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fugue-generator"
version = "0.1.0"
description = "A data processing and generation pipeline for fugues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "music21>=9,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fugue*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # Import-related style errors
    "E7",  # Statement-related style errors
    "E9",  # Runtime-related syntax errors
    "F",   # Undefined names, unused imports, and related checks
    "I",   # Import sorting
]